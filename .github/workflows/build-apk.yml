name: Build Nova Capture APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare APK Output
      run: |
        mkdir -p build-artifacts
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/NovaCapture-v1.0.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NovaCapture-v1.0.0-APK
        path: build-artifacts/NovaCapture-v1.0.0.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Nova Capture v1.0.0 - Production Release"
        body: |
          ### Nova Capture v1.0.0
          - **Floating Shutter Widget:** Movable pill with single-tap screenshot & video recording toggle.
          - **Public Gallery Integration:** Saves screenshots straight to `DCIM/Screenshots` and videos to `Movies/NovaCapture`.
          - **Presentation Mode:** Minimal dashboard with recent media view and quick share/delete.
          - **100% Offline & Private:** Zero cloud sync, secure local storage.
        files: build-artifacts/NovaCapture-v1.0.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
